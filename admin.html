<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Administração | Viva Santarém</title>
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <main class="shell">
    <a class="voltar" href="index.html">← Voltar ao site</a>
    <section id="login-view" class="card login-card">
      <p class="eyebrow">VIVA SANTARÉM</p>
      <h1>Acesso da equipe</h1>
      <p>Entre com a conta autorizada como administrador ou desenvolvedor.</p>
      <form id="login-form">
        <label for="email">E-mail</label>
        <input id="email" type="email" autocomplete="username" required>
        <label for="password">Senha</label>
        <input id="password" type="password" autocomplete="current-password" required>
        <button type="submit">Entrar</button>
      </form>
      <p id="login-status" class="status" aria-live="polite"></p>
    </section>

    <section id="admin-view" hidden>
      <header class="admin-header">
        <div><p class="eyebrow">PAINEL DA EQUIPE</p><h1>Administrar o Viva Santarém</h1><p id="account-label"></p></div>
        <button id="logout-button" class="secondary" type="button">Sair</button>
      </header>
      <nav id="tabs" class="tabs" aria-label="Conteúdo do site"></nav>
      <section class="card editor-card">
        <div class="editor-heading"><div><h2 id="section-title"></h2><p>Gerencie o que aparece no site e publique quando estiver pronto.</p></div><button id="new-button" type="button">+ Novo registro</button></div>
        <p id="list-status" class="status" aria-live="polite"></p>
        <div id="records" class="records"></div>
      </section>
      <section id="form-card" class="card form-card" hidden>
        <h2 id="form-title">Novo registro</h2>
        <form id="record-form" class="record-form"></form>
        <p id="form-status" class="status" aria-live="polite"></p>
      </section>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
